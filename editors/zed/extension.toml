id = "mayu"
name = "Mayu"
version = "0.0.1"
schema_version = 1
authors = ["Andrés Alin <andreas.alin@gmail.com>"]
description = "Language server for Mayu projects"
repository = "https://github.com/mayu-live/framework"

# The Haml language is provided by the Haml extension (davidcornu/zed-haml),
# so install that extension too. "HAML" is the language name used by the
# tree-sitter-haml fork's Zed extension (aalin/tree-sitter-haml).
[language_servers.mayu]
name = "Mayu"
languages = ["Haml", "HAML"]
