[development]
  secret_key = "dev"

  [development.server]
    listen = "https://localhost:9292"
    self_signed_cert = true

    hmr = true

    render_exceptions = true

    generate_assets = true

    session_timeout_seconds = 15
    transfer_timeout_seconds = 10
    cookie_timeout_seconds = 60

  [development.metrics]
    enabled = true
    listen = "http://localhost:9091"

[production]
  secret_key = "$MAYU_SECRET_KEY"

  [production.server]
    listen = "http://0.0.0.0:3333"
    self_signed_cert = false
    h2c = true

    # The Fly deployment supplies its external origin after TLS termination.
    public_origin = "$MAYU_PUBLIC_ORIGIN"

    # If a proxy terminates HTTPS or rewrites Host, list its IPs or CIDRs here.
    # Mayu trusts its X-Forwarded-Proto and X-Forwarded-Host for origin checks;
    # the proxy must overwrite both headers. No proxies are trusted by default.
    # trusted_proxies = ["127.0.0.1/32", "::1/128"]

    hmr = false

    render_exceptions = false

    generate_assets = false

    session_timeout_seconds = 15
    transfer_timeout_seconds = 10
    cookie_timeout_seconds = 60

  [production.metrics]
    enabled = true
    listen = "http://0.0.0.0:9091"
