# fly.toml app configuration file generated for mayu on 2024-01-11T00:11:41-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "mayu"
primary_region = "dfw"
kill_signal = "SIGINT"
kill_timeout = "5s"

[deploy]
  strategy = "rolling"

[env]
  ENABLE_YJIT = "true"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Fly's http handler normally downgrades to HTTP/1.1 towards the app.
  # h2_backend makes it speak h2c (prior knowledge) instead, which server.rb supports.
  [http_service.http_options]
    h2_backend = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[metrics]]
  port = 9091
  path = "/metrics"
