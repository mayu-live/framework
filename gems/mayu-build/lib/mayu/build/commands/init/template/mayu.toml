[development]
  secret_key = "dev"

  [development.server]
    listen = "https://localhost:9292"

    hmr = true

    render_exceptions = true
    self_signed_cert = true

    generate_assets = true

    session_timeout_seconds = 15
    transfer_timeout_seconds = 10
    cookie_timeout_seconds = 60

  [development.metrics]
    enabled = true
    listen = "http://localhost:9091"

[production]
  secret_key = "$MAYU_SECRET_KEY"

  [production.server]
    # Fly terminates TLS and speaks h2c to the app. To run the container
    # locally, see "Run the container locally" in README.md.
    listen = "http://0.0.0.0:3333"
    self_signed_cert = false
    h2c = true

    hmr = false

    render_exceptions = false

    generate_assets = false

    session_timeout_seconds = 15
    transfer_timeout_seconds = 10
    cookie_timeout_seconds = 60

  [production.metrics]
    enabled = true
    listen = "http://0.0.0.0:9091"
