# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "mayu"
primary_region = "bog"
kill_signal = "SIGINT"
kill_timeout = "20s"

[build]

[deploy]
  strategy = "rolling"

[env]
  ENABLE_YJIT = "true"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Fly's http handler normally downgrades to HTTP/1.1 towards the app.
  # h2_backend makes it speak h2c instead, which `h2c = true` in mayu.toml
  # accepts. Mayu needs HTTP/2 to keep sessions.
  [http_service.http_options]
    h2_backend = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[metrics]]
  port = 9091
  path = "/metrics"
