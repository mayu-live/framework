<style>
  :host {
    --navigation-progress-color: light-dark(#0284c7, #7dd3fc);
    --navigation-progress-glow: light-dark(#7dd3fc, #38bdf8);
  }

  #bar {
    box-sizing: border-box;
    position: fixed;
    inset: 0;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 3px;
    max-width: none;
    border: 0;
    overflow: hidden;
    pointer-events: none;
    background: transparent;
  }

  #bar::before {
    display: block;
    width: 100%;
    height: 100%;
    content: "";
    background: var(--navigation-progress-color);
    box-shadow: 0 0 0.5rem var(--navigation-progress-glow);
    transform: scaleX(0);
    transform-origin: left;
    transition:
      transform 180ms ease-out,
      opacity 180ms ease-out;
  }

  #bar:popover-open::before {
    animation: navigation-progress 8s ease-out forwards;
  }

  #bar.is-complete::before {
    animation: none;
    opacity: 0;
    transform: scaleX(1);
  }

  @keyframes navigation-progress {
    from {
      transform: scaleX(0.08);
    }
    to {
      transform: scaleX(0.85);
    }
  }
</style>
<div id="bar" popover="manual" aria-hidden="true"></div>
