<style>
  :host {
    /* light-dark() follows the color-scheme inherited from the page. A page
       that declares none gets the light colors. */
    --ping-color: light-dark(#1b2430, #fff);
    --ping-background: light-dark(#ffffffa6, #17202ba6);
    --ping-border: light-dark(#0000001f, #ffffff4d);
    --ping-shadow: light-dark(#0003, #0008);
    --ping-text-shadow: light-dark(#fff, #000);
    --ping-disconnected: light-dark(#fca5a5a6, #a61b1ba6);
    --ping-connected: light-dark(#bbf7d0a6, #2f6b18a6);
    --ping-transferring: light-dark(#bfdbfea6, #0b5caba6);

    --navigation-progress-color: light-dark(#0284c7, #7dd3fc);
    --navigation-progress-glow: light-dark(#7dd3fc, #38bdf8);

    --dialog-color: light-dark(#000c, #fffc);
    --dialog-background: light-dark(#ffffffee, #0f1218ee);
    --dialog-border: light-dark(#0000001a, #fff1);
    --dialog-shadow: light-dark(#0003, #0008);
    --dialog-backdrop: light-dark(
      rgb(240 243 248 / 0.52),
      rgb(10 14 20 / 0.52)
    );
    --dialog-accent: light-dark(#d6204a, #ff90a3);
    --dialog-text: light-dark(#2a3140, #d7deee);
    --dialog-muted: light-dark(#2a314099, #d7deee99);
    --countdown-track: light-dark(#d6204a33, #ff90a366);
  }

  .mayu-ping {
    box-sizing: border-box;
    position: fixed;
    top: 0;
    right: auto;
    bottom: auto;
    left: 0;
    margin: 0;
    padding: 0 2px;
    z-index: 2147483647;

    pointer-events: none;

    color: var(--ping-color);
    font-size: 9px;
    font-weight: 100;
    font-family: monospace;
    font-variant-numeric: tabular-nums;
    background: var(--ping-background);
    backdrop-filter: blur(3px);

    border: 1px solid var(--ping-border);
    border-radius: 2px 0 0 0;
    border-width: 1px 0 0 1px;

    box-shadow: 0 0 0.5rem var(--ping-shadow);
    text-shadow: 0 1px 1px var(--ping-text-shadow);
    width: max-content;
  }

  .ping {
    display: block;
  }

  .status-disconnected {
    background-color: var(--ping-disconnected);
  }
  .status-connected {
    background-color: var(--ping-connected);
  }
  .status-transferring {
    background-color: var(--ping-transferring);
  }

  .navigation-progress {
    box-sizing: border-box;
    position: fixed;
    inset: 0;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 3px;
    max-width: none;
    border: 0;
    overflow: hidden;
    pointer-events: none;
    background: transparent;
  }

  .navigation-progress::before {
    display: block;
    width: 100%;
    height: 100%;
    content: "";
    background: var(--navigation-progress-color);
    box-shadow: 0 0 0.5rem var(--navigation-progress-glow);
    transform: scaleX(0);
    transform-origin: left;
    transition:
      transform 180ms ease-out,
      opacity 180ms ease-out;
  }

  .navigation-progress:popover-open::before {
    animation: navigation-progress 8s ease-out forwards;
  }

  .navigation-progress.is-complete::before {
    animation: none;
    opacity: 0;
    transform: scaleX(1);
  }

  @keyframes navigation-progress {
    from {
      transform: scaleX(0.08);
    }
    to {
      transform: scaleX(0.85);
    }
  }

  .disconnect-dialog {
    --spring-easing: linear(
      0,
      0.0014 0.3%,
      0.0088 0.74%,
      0.0409,
      0.0932 2.51%,
      0.1753 3.54%,
      0.3533 5.31%,
      0.853 9.74%,
      0.9831,
      1.0937,
      1.182 13.73%,
      1.2406,
      1.2807 16.09%,
      1.294 16.68%,
      1.3046,
      1.309 18.16%,
      1.3067,
      1.2971 19.93%,
      1.278 20.96%,
      1.2255 22.88%,
      1.0563 27.75%,
      0.9864 30.11%,
      0.9557,
      0.9323,
      0.9161 34.1%,
      0.9065 35.57%,
      0.9045,
      0.9051,
      0.908 38.23%,
      0.9138 39.27%,
      0.9314 41.33%,
      0.9822 46.06%,
      1.0039 48.42%,
      1.0201 50.93%,
      1.0254,
      1.0285 53.58%,
      1.0294 55.5%,
      1.0267 57.57%,
      0.9993 66.57%,
      0.9941,
      0.9914 71.59%,
      0.9917 75.87%,
      0.9998 84.43%,
      1.0024 88.72%,
      1.0009 99.93%
    );
    --spring-duration: 500ms;

    font: inherit;
    border: 1px solid var(--dialog-border);
    border-radius: 12px;
    background: var(--dialog-background);
    color: var(--dialog-color);
    padding: 1rem;
    min-width: 16rem;
    box-shadow: 0 1rem 2rem var(--dialog-shadow);
    user-select: none;

    opacity: 0;
    scale: 0;
    transition:
      opacity 200ms ease-out,
      scale 200ms ease-out;
  }

  .disconnect-dialog:open.is-visible {
    opacity: 1;
    scale: 1;
    transition:
      opacity 200ms ease-out,
      scale var(--spring-duration) var(--spring-easing);
  }

  .disconnect-dialog::backdrop {
    background: transparent;
    backdrop-filter: blur(0);
    transition:
      background-color 200ms ease-out,
      backdrop-filter 200ms ease-out;
  }

  .disconnect-dialog:open.is-visible::backdrop {
    background: var(--dialog-backdrop);
    backdrop-filter: blur(5px);
  }

  .disconnect-title {
    margin: 0;
    font-weight: 700;
    color: var(--dialog-accent);
  }

  .disconnect-text {
    margin: 0.55rem 0 0;
    color: var(--dialog-text);
  }

  .reconnect-status {
    margin: 0.35rem 0 0;
    color: var(--dialog-muted);
    font-size: 0.85em;
    font-variant-numeric: tabular-nums;
  }

  .disconnect-body {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .reconnect-countdown {
    position: relative;
    flex: none;
    width: 2.75rem;
    height: 2.75rem;
  }

  .reconnect-countdown[hidden] {
    display: none;
  }

  .reconnect-countdown svg {
    display: block;
    width: 100%;
    height: 100%;
    rotate: -90deg;
  }

  .reconnect-track,
  .reconnect-arc {
    fill: none;
    stroke-width: 3;
  }

  .reconnect-track {
    stroke: var(--countdown-track);
  }

  .reconnect-arc {
    stroke: var(--dialog-accent);
    stroke-linecap: round;
    stroke-dasharray: 1 1;
  }

  .reconnect-countdown.is-waiting .reconnect-arc {
    animation: reconnect-countdown var(--retry-duration, 0ms) linear forwards;
  }

  .reconnect-countdown.is-connecting .reconnect-arc {
    stroke-dasharray: 0.25 0.75;
  }

  .reconnect-countdown.is-connecting svg {
    animation: reconnect-spin 1s linear infinite;
  }

  .reconnect-seconds {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--dialog-text);
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  @keyframes reconnect-countdown {
    from {
      stroke-dashoffset: 0;
    }
    to {
      stroke-dashoffset: 1;
    }
  }

  @keyframes reconnect-spin {
    from {
      rotate: -90deg;
    }
    to {
      rotate: 270deg;
    }
  }
</style>
<div class="mayu-ping">
  <span class="ping">N/A</span>
</div>
<div class="navigation-progress" popover="manual" aria-hidden="true"></div>
<dialog class="disconnect-dialog" closedby="none" aria-label="Connection lost">
  <div class="disconnect-body">
    <div class="reconnect-countdown" hidden aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <circle class="reconnect-track" cx="18" cy="18" r="16" />
        <circle class="reconnect-arc" cx="18" cy="18" r="16" pathLength="1" />
      </svg>
      <span class="reconnect-seconds"></span>
    </div>
    <div>
      <p class="disconnect-title">Disconnected</p>
      <p class="disconnect-text">Trying to reconnect…</p>
      <p class="reconnect-status" hidden></p>
    </div>
  </div>
</dialog>
