<style>
  .mayu-ping {
    box-sizing: border-box;
    position: fixed;
    top: auto;
    right: 0;
    bottom: 0;
    left: auto;
    margin: 0;
    transform: translate(
      calc(-1 * var(--mayu-visual-viewport-right, 0px)),
      calc(-1 * var(--mayu-visual-viewport-bottom, 0px))
    );
    padding: 0 2px;

    pointer-events: none;

    color: #fff;
    font-size: 9px;
    font-weight: 100;
    font-family: monospace;
    font-variant-numeric: tabular-nums;
    background: #17202ba6;
    backdrop-filter: blur(3px);

    border: 1px solid #ffffff4d;
    border-radius: 2px 0 0 0;
    border-width: 1px 0 0 1px;

    box-shadow: 0 0 0.5rem #0008;
    text-shadow: 0 1px 1px #000;
    width: max-content;
  }

  .ping {
    display: block;
  }

  .status-disconnected {
    background-color: #a61b1ba6;
  }
  .status-connected {
    background-color: #2f6b18a6;
  }
  .status-transferring {
    background-color: #0b5caba6;
  }

  .disconnect-dialog {
    font: inherit;

    border: 1px solid #fff1;
    border-radius: 12px;
    background: #0f1218ee;
    color: #fffc;
    padding: 1rem;
    min-width: 16rem;
    box-shadow: 0 1rem 2rem #0008;
    user-select: none;
  }

  .disconnect-dialog::backdrop {
    background: rgb(10 14 20 / 0.52);
    backdrop-filter: blur(5px);
  }

  .disconnect-title {
    margin: 0;
    font-weight: 700;
    color: #ff90a3;
  }

  .disconnect-text {
    margin: 0.55rem 0 0;
    color: #d7deee;
  }
</style>
<div class="mayu-ping" popover="manual">
  <span class="ping">N/A</span>
</div>
<dialog class="disconnect-dialog" closedby="none" aria-label="Connection lost">
  <p class="disconnect-title">Disconnected</p>
  <p class="disconnect-text">Trying to reconnect…</p>
</dialog>
