<style>
  .mayu-ping {
    box-sizing: border-box;
    position: fixed;
    top: 0;
    right: auto;
    bottom: auto;
    left: 0;
    margin: 0;
    padding: 0 2px;
    z-index: 2147483647;

    pointer-events: none;

    color: #fff;
    font-size: 9px;
    font-weight: 100;
    font-family: monospace;
    font-variant-numeric: tabular-nums;
    background: #17202ba6;
    backdrop-filter: blur(3px);

    border: 1px solid #ffffff4d;
    border-radius: 2px 0 0 0;
    border-width: 1px 0 0 1px;

    box-shadow: 0 0 0.5rem #0008;
    text-shadow: 0 1px 1px #000;
    width: max-content;
  }

  .ping {
    display: block;
  }

  .status-disconnected {
    background-color: #a61b1ba6;
  }
  .status-connected {
    background-color: #2f6b18a6;
  }
  .status-transferring {
    background-color: #0b5caba6;
  }

  .navigation-progress {
    box-sizing: border-box;
    position: fixed;
    inset: 0;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 3px;
    max-width: none;
    border: 0;
    overflow: hidden;
    pointer-events: none;
    background: transparent;
  }

  .navigation-progress::before {
    display: block;
    width: 100%;
    height: 100%;
    content: "";
    background: #7dd3fc;
    box-shadow: 0 0 0.5rem #38bdf8;
    transform: scaleX(0);
    transform-origin: left;
    transition:
      transform 180ms ease-out,
      opacity 180ms ease-out;
  }

  .navigation-progress:popover-open::before {
    animation: navigation-progress 8s ease-out forwards;
  }

  .navigation-progress.is-complete::before {
    animation: none;
    opacity: 0;
    transform: scaleX(1);
  }

  @keyframes navigation-progress {
    from {
      transform: scaleX(0.08);
    }
    to {
      transform: scaleX(0.85);
    }
  }

  .disconnect-dialog {
    --spring-easing: linear(
      0,
      0.0014 0.3%,
      0.0088 0.74%,
      0.0409,
      0.0932 2.51%,
      0.1753 3.54%,
      0.3533 5.31%,
      0.853 9.74%,
      0.9831,
      1.0937,
      1.182 13.73%,
      1.2406,
      1.2807 16.09%,
      1.294 16.68%,
      1.3046,
      1.309 18.16%,
      1.3067,
      1.2971 19.93%,
      1.278 20.96%,
      1.2255 22.88%,
      1.0563 27.75%,
      0.9864 30.11%,
      0.9557,
      0.9323,
      0.9161 34.1%,
      0.9065 35.57%,
      0.9045,
      0.9051,
      0.908 38.23%,
      0.9138 39.27%,
      0.9314 41.33%,
      0.9822 46.06%,
      1.0039 48.42%,
      1.0201 50.93%,
      1.0254,
      1.0285 53.58%,
      1.0294 55.5%,
      1.0267 57.57%,
      0.9993 66.57%,
      0.9941,
      0.9914 71.59%,
      0.9917 75.87%,
      0.9998 84.43%,
      1.0024 88.72%,
      1.0009 99.93%
    );
    --spring-duration: 500ms;

    font: inherit;
    border: 1px solid #fff1;
    border-radius: 12px;
    background: #0f1218ee;
    color: #fffc;
    padding: 1rem;
    min-width: 16rem;
    box-shadow: 0 1rem 2rem #0008;
    user-select: none;

    opacity: 0;
    scale: 0;
    transition:
      opacity 200ms ease-out,
      scale 200ms ease-out;
  }

  .disconnect-dialog:open.is-visible {
    opacity: 1;
    scale: 1;
    transition:
      opacity 200ms ease-out,
      scale var(--spring-duration) var(--spring-easing);
  }

  .disconnect-dialog::backdrop {
    background: transparent;
    backdrop-filter: blur(0);
    transition:
      background-color 200ms ease-out,
      backdrop-filter 200ms ease-out;
  }

  .disconnect-dialog:open.is-visible::backdrop {
    background: rgb(10 14 20 / 0.52);
    backdrop-filter: blur(5px);
  }

  .disconnect-title {
    margin: 0;
    font-weight: 700;
    color: #ff90a3;
  }

  .disconnect-text {
    margin: 0.55rem 0 0;
    color: #d7deee;
  }
</style>
<div class="mayu-ping">
  <span class="ping">N/A</span>
</div>
<div class="navigation-progress" popover="manual" aria-hidden="true"></div>
<dialog class="disconnect-dialog" closedby="none" aria-label="Connection lost">
  <p class="disconnect-title">Disconnected</p>
  <p class="disconnect-text">Trying to reconnect…</p>
</dialog>
