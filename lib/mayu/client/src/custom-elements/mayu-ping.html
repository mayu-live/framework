<style>
  .mayu-ping {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 10000;
    display: inline-flex;
    align-items: center;
    padding: 0.35rem 0.55rem;
    border-radius: 999px;
    background: rgba(16, 20, 28, 0.65);
    backdrop-filter: blur(6px);
    border: 3px solid #8a92a6;
    outline: 1px solid #0003;
    color: #e9eef7;
    font-size: 0.75rem;
    font-weight: 600;
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: 0.02em;
    box-shadow: 0 0 1em -0.1em #000;
    transition: background 200ms ease, border-color 500ms ease,
      opacity 200ms ease;
    opacity: 0.85;
    min-width: 4em;
    justify-content: space-between;
  }

  .ping {
    width: 6ch;
    text-align: right;
  }

  .status-disconnected {
    border-color: #ff5f7a;
  }
  .status-connected {
    border-color: #33d17a;
  }
  .status-transferring {
    border-color: #6aa8ff;
  }

  .disconnect-dialog {
    border: 1px solid #ffffff1a;
    border-radius: 12px;
    background: #0f1218ee;
    color: #f2f5fc;
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    padding: 1rem 1.1rem;
    min-width: 16rem;
    box-shadow: 0 0.8rem 2.2rem #00000080;
    user-select: none;
  }

  .disconnect-dialog::backdrop {
    background: rgba(10, 14, 20, 0.52);
    backdrop-filter: blur(2px);
  }

  .disconnect-title {
    margin: 0;
    font-weight: 700;
    color: #ff90a3;
  }

  .disconnect-text {
    margin: 0.55rem 0 0;
    color: #d7deee;
  }
</style>
<div class="mayu-ping">
  <span class="ping">N/A</span>
</div>
<dialog class="disconnect-dialog" closedby="none" aria-label="Connection lost">
  <p class="disconnect-title">Disconnected</p>
  <p class="disconnect-text">Trying to reconnect…</p>
</dialog>
