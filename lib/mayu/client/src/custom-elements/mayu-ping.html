<style>
  .mayu-ping {
    position: fixed;
    bottom: 1rem;
    right: 1rem;

    z-index: 10000;
    padding: 0.25rem 0.5rem;

    color: #fffc;
    font-size: 12px;
    font-family: monospace;
    background: #0006;
    backdrop-filter: blur(5px);

    border: 3px solid #0003;
    border-radius: 100vw;
    outline: 1px solid #0006;

    box-shadow: 0 0 1em #0006;
    transition: background-color 500ms;
    opacity: 0.85;
  }

  .ping {
    width: 6ch;
    display: block;
    text-align: right;
  }

  .status-disconnected {
    background-color: #e53935;
  }
  .status-connected {
    background-color: #8bc34a;
  }
  .status-transferring {
    background-color: #2196f3;
  }

  .disconnect-dialog {
    font: inherit;

    border: 1px solid #fff1;
    border-radius: 12px;
    background: #0f1218ee;
    color: #fffc;
    padding: 1rem;
    min-width: 16rem;
    box-shadow: 0 1rem 2rem #0008;
    user-select: none;
  }

  .disconnect-dialog::backdrop {
    background: rgb(10 14 20 / 0.52);
    backdrop-filter: blur(5px);
  }

  .disconnect-title {
    margin: 0;
    font-weight: 700;
    color: #ff90a3;
  }

  .disconnect-text {
    margin: 0.55rem 0 0;
    color: #d7deee;
  }
</style>
<div class="mayu-ping">
  <span class="ping">N/A</span>
</div>
<dialog class="disconnect-dialog" closedby="none" aria-label="Connection lost">
  <p class="disconnect-title">Disconnected</p>
  <p class="disconnect-text">Trying to reconnect…</p>
</dialog>
