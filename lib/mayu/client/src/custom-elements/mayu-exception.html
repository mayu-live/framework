<style>
  :host {
    --panel-bg: #0f1117;
    --panel-border: #232834;
    --panel-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    --text: #e6e8ef;
    --muted: #9aa3b2;
    --accent: #ff4d6d;
    --accent-strong: #ff2d55;
    --line: #2a3140;
    --code-bg: #121621;
    --code-line: #1c2333;
    --highlight: #32151b;
    --badge-bg: #2b0f15;
    --badge-text: #ff99ab;
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    color: var(--text);
  }

  dialog {
    position: fixed;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 1100px);
    max-height: 85vh;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--panel-shadow);
    z-index: 10001;
    font-size: 0.84rem;
  }

  dialog::backdrop {
    background: rgba(8, 10, 15, 0.7);
    backdrop-filter: blur(6px);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.65rem;
    padding: 0.65rem 0.9rem;
    background: linear-gradient(135deg, #1b0f17, #1c1324 55%, #141722);
    border-bottom: 1px solid var(--line);
  }

  .header-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 0.3rem 0.45rem;
  }

  .exception-class {
    display: inline-block;
    padding: 0.12rem 0.4rem;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
    font-size: 0.74em;
    letter-spacing: 0.05em;
    overflow-wrap: anywhere;
  }

  h1 {
    margin: 0;
    flex: 1 1 22rem;
    min-width: 12rem;
    font-size: 0.94em;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
    overflow-wrap: anywhere;
  }

  .close {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 0.18rem 0.4rem;
    font-size: 0.88em;
    line-height: 1.2;
    cursor: pointer;
    transition: all 120ms ease;
    flex: 0 0 auto;
  }

  .close:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(30em, 1fr));
    gap: 0.65rem;
    padding: 0.75rem 0.9rem 0.9rem;
    overflow: auto;
  }

  .source-panel {
    grid-column: span 2;
  }

  .message-panel {
    grid-column: span 2;
  }

  .message-body {
    margin: 0;
    color: var(--muted);
    line-height: 1.25;
    overflow-wrap: anywhere;
    min-height: 0;
    overflow: auto;
  }

  @media (max-width: 60em) {
    .source-panel,
    .message-panel {
      grid-column: auto;
    }
  }

  section {
    background: rgba(16, 19, 28, 0.6);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.55rem 0.6rem 0.5rem;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 0.35rem;
    overflow: hidden;
  }

  h2 {
    margin: 0;
    font-size: 0.76em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  ul,
  ol {
    margin: 0;
    padding: 0;
    list-style: none;
    min-height: 0;
    overflow: auto;
    font-size: 0.9em;
    line-height: 1.15em;
  }

  ol {
    counter-reset: line;
    scroll-snap-type: y proximity;
    scroll-padding: 2rem;
  }

  ::slotted(.tree-item),
  ::slotted(.trace-item),
  ::slotted(.source-line) {
    font-size: inherit;
    line-height: inherit;
  }

  ::slotted(.tree-item),
  ::slotted(.trace-item) {
    padding: 0.12rem 0.28rem;
    border-radius: 4px;
    color: var(--text);
    display: grid;
    gap: 0.12rem;
  }

  ::slotted(.tree-item) {
    color: #7fd1ff;
  }

  ::slotted(.trace-item.is-interesting) {
    background: var(--highlight);
    color: #ffd6dd;
    border: 1px solid #52212c;
  }

  ::slotted(.source-line) {
    padding: 0.1rem 0.25rem;
    border-radius: 4px;
    background: #0f121a;
    color: #f5f7ff;
    white-space: pre;
    font-variant-numeric: tabular-nums;
  }

  ::slotted(.source-line.is-interesting) {
    background: #261018;
    border: 1px solid #ff5f7a;
    color: #ffe2e8;
  }

  ::slotted(.is-interesting) {
    scroll-snap-align: start;
  }

  ::slotted(.exception-class),
  ::slotted(.filename) {
    overflow-wrap: anywhere;
  }

  ::slotted(.message) {
    color: inherit;
  }
</style>
<dialog>
  <header>
    <div class="header-main">
      <span class="exception-class">
        <slot name="exception-class">Runtime Error</slot>
      </span>
      <h1><slot name="filename"></slot></h1>
    </div>
    <button class="close" data-action="close">Close</button>
  </header>
  <main>
    <section class="message-panel">
      <h2>Message</h2>
      <p class="message-body"><slot name="message"></slot></p>
    </section>
    <section>
      <h2>Backtrace</h2>
      <ul>
        <slot name="backtrace"></slot>
      </ul>
    </section>
    <section>
      <h2>Tree Path</h2>
      <ul>
        <slot name="tree-path"></slot>
      </ul>
    </section>
    <section class="source-panel">
      <h2>Source</h2>
      <ol>
        <slot name="source"></slot>
      </ol>
    </section>
  </main>
</dialog>
