<style>
  :host {
    --panel-bg: #0f1117;
    --panel-border: #232834;
    --panel-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    --text: #e6e8ef;
    --muted: #9aa3b2;
    --accent: #ff4d6d;
    --accent-strong: #ff2d55;
    --line: #2a3140;
    --code-bg: #121621;
    --code-line: #1c2333;
    --highlight: #32151b;
    --badge-bg: #2b0f15;
    --badge-text: #ff99ab;
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    color: var(--text);
  }

  dialog {
    position: fixed;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 1100px);
    max-height: 85vh;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--panel-shadow);
    z-index: 10001;
  }

  dialog::backdrop {
    background: rgba(8, 10, 15, 0.7);
    backdrop-filter: blur(6px);
  }

  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    background: linear-gradient(135deg, #1b0f17, #1c1324 55%, #141722);
    border-bottom: 1px solid var(--line);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    flex: 1;
    color: var(--text);
  }

  .close {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    transition: all 120ms ease;
  }

  .close:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(30em, 1fr));
    gap: 1rem;
    padding: 1.25rem 1.5rem 1.5rem;
    overflow: auto;
  }

  .source-panel {
    grid-column: span 2;
  }

  @media (max-width: 60em) {
    .source-panel {
      grid-column: auto;
    }
  }

  section {
    background: rgba(16, 19, 28, 0.6);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.9rem 0.9rem 0.8rem;
    display: grid;
    gap: 0.6rem;
    min-height: 8em;
    overflow-x: auto;
  }

  h2 {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  ul,
  ol {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  ol {
    counter-reset: line;
  }

  ::slotted(.tree-item),
  ::slotted(.trace-item) {
    padding: 0.2rem 0.35rem;
    border-radius: 6px;
    color: var(--text);
    display: grid;
    gap: 0.25rem;
    line-height: 1.35;
  }

  ::slotted(.tree-item) {
    color: #7fd1ff;
  }

  ::slotted(.trace-item.is-interesting) {
    background: var(--highlight);
    color: #ffd6dd;
    border: 1px solid #52212c;
  }

  ::slotted(.source-line) {
    padding: 0.2rem 0.35rem;
    border-radius: 6px;
    background: #0f121a;
    color: #f5f7ff;
    white-space: pre;
    font-variant-numeric: tabular-nums;
  }

  ::slotted(.source-line.is-interesting) {
    background: #261018;
    border: 1px solid #ff5f7a;
    color: #ffe2e8;
  }

  ::slotted(.title) {
    font-weight: 600;
  }
</style>
<dialog>
  <header>
    <span class="badge">Runtime Error</span>
    <h1><slot name="title"></slot></h1>
    <button class="close" data-action="close">Close</button>
  </header>
  <main>
    <section>
      <h2>Backtrace</h2>
      <ul>
        <slot name="backtrace"></slot>
      </ul>
    </section>
    <section>
      <h2>Tree Path</h2>
      <ul>
        <slot name="tree-path"></slot>
      </ul>
    </section>
    <section class="source-panel">
      <h2>Source</h2>
      <ol>
        <slot name="source"></slot>
      </ol>
    </section>
  </main>
</dialog>
