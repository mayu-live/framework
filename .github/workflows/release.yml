name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - name: Verify tag and release metadata
        id: release
        run: |
          version="$(ruby -r./gems/mayu-live/lib/mayu/version -e 'print Mayu::VERSION')"
          test "$GITHUB_REF_TYPE" = "tag"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error title=Tag does not match version::Tag ${GITHUB_REF_NAME} but gems/mayu-live/lib/mayu/version.rb says ${version}."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release tag is not on main::Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not contained in origin/main. Merge it to main, then rerun."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install node packages
        run: npm ci
      - name: Run tests
        run: bundle exec rake test
      - name: Build browser runtime and package gems
        run: bundle exec rake build
      - name: Upload gems
        uses: actions/upload-artifact@v7
        with:
          name: release-gems
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
      - name: Download gems
        uses: actions/download-artifact@v4
        with:
          name: release-gems
          path: pkg
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2
      # mayu-build depends on mayu-live at the same version, so mayu-live goes
      # first. A gem that is already published at this version is skipped, so
      # a failed run can be retried.
      - name: Publish gems to RubyGems.org
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for name in mayu-live mayu-build; do
            gem="pkg/${name}-${VERSION}.gem"
            test -f "$gem"
            if gem push "$gem" > push.out 2>&1; then
              cat push.out
            elif grep -q "Repushing of gem versions is not allowed" push.out; then
              echo "${name} ${VERSION} is already published, skipping."
            else
              sed 's/^/::error:: /' push.out
              exit 1
            fi
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" pkg/*.gem --clobber
          else
            gh release create "$TAG" pkg/*.gem \
              --verify-tag \
              --generate-notes \
              --title "Mayu ${VERSION}"
          fi
